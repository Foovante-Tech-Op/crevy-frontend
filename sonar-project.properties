# SonarCloud configuration for crevy-frontend.
#
# These two keys look similar and are not interchangeable — confusing them
# cost the backend several red pipelines, so the same note lives here.
#
# sonar.organization is the org KEY: a lowercase slug, not the display name.
# The GitHub org renders as Foovante-Tech-Op, but /api/organizations/search
# returns key=foovante-tech-op, and the scanner rejects the wrong case outright:
#   ERROR Organization key 'Foovante-Tech-Op' does not exist.
#
# sonar.projectKey is the PROJECT key SonarCloud generates when the repo is
# imported — <GitHubOrg>_<repo>, case preserved. It is NOT the org key. Setting
# it wrong does not fail loudly: SonarCloud auto-provisions on first analysis,
# so the scanner cheerfully creates and analyzes a phantom project while the
# real one sits untouched. The symptom is a 403 from the quality-gate step.
sonar.projectKey=Foovante-Tech-Op_crevy-frontend
sonar.organization=foovante-tech-op

# Turn OFF Automatic Analysis in the SonarCloud project's Administration →
# Analysis Method before the first CI run. The two are mutually exclusive and
# the scanner aborts with "You are running CI analysis while Automatic Analysis
# is enabled" — which reads like a scanner bug rather than a project setting.

sonar.sources=src

# This repo has no test suite, so there is nothing to declare as sonar.tests
# and no LCOV report to point at. Coverage on New Code will be 0% and the
# quality gate will be red; the workflow runs the gate step with
# continue-on-error for exactly that reason. Add sonar.tests /
# sonar.javascript.lcov.reportPaths here when tests land.

# .next and .open-next are build output. public/ is static assets — indexing a
# minified vendor bundle or a font produces thousands of meaningless issues and
# slows analysis for no benefit.
sonar.exclusions=node_modules/**,.next/**,.open-next/**,out/**,public/**,**/*.d.ts
